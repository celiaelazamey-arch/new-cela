name: Autonomous Agent Pipeline

# مشغّل الوكيل التلقائي — يعمل مجاناً 100% على GitHub-hosted runner
# ويجعل المستودع يتفاعل مع أي Issue يحمل التصنيف agent-task
# أو عبر تشغيل يدوي (workflow_dispatch).

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      task_prompt:
        description: 'المهمة المطلوبة من الوكيل'
        required: true
      mode:
        description: 'نمط التنفيذ'
        required: false
        default: 'reason'
        type: choice
        options:
          - reason
          - browser
          - code

# منع التشغيل المتوازي لحماية الحصص المجانية (Rate Limits)
concurrency:
  group: agent-runner-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  execute-agent:
    # يعمل فقط عند: Issue جديد مصنّف agent-task، أو تشغيل يدوي
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.issue.labels.*.name, 'agent-task')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      # الذاكرة الاستراتيجية تبقى بين التشغيلات دون رفعها إلى المستودع:
      # استعادة أحدث كاش للفرع، ثم حفظ كاش جديد في نهاية المهمة تلقائياً.
      - name: Restore Strategic Memory
        uses: actions/cache@v4
        with:
          path: .agent_memory
          key: agent-memory-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            agent-memory-${{ github.ref_name }}-
            agent-memory-

      - name: Resolve Task
        id: resolve
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          DISPATCH_TASK: ${{ inputs.task_prompt }}
        run: |
          if [ "${{ github.event_name }}" = "issues" ]; then
            printf '%s\n\n%s' "$ISSUE_TITLE" "$ISSUE_BODY" > agent_task.txt
          else
            printf '%s' "$DISPATCH_TASK" > agent_task.txt
          fi
          echo "تم تحضير المهمة ($(wc -c < agent_task.txt) حرفاً)"

      - name: Execute Autonomous Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -o pipefail
          python -m src.main \
            --mode "${{ inputs.mode || 'reason' }}" \
            --task "$(cat agent_task.txt)" 2>&1 | tee agent_result.txt

      - name: Comment Result on Issue
        if: github.event_name == 'issues' && always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          {
            echo "### 🤖 نتيجة الوكيل المستقل"
            echo ""
            echo '```'
            tail -c 60000 agent_result.txt 2>/dev/null || echo "لا توجد مخرجات."
            echo '```'
            echo ""
            echo "_آلية التشغيل: GitHub Actions (مجاني) — المزود: Gemini / Groq Free Tier_"
          } > comment_body.md
          gh issue comment "$ISSUE_NUMBER" --body-file comment_body.md

      - name: Upload Result Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-result
          path: agent_result.txt
          if-no-files-found: ignore
          retention-days: 7
