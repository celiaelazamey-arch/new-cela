name: Autonomous Agent Pipeline

# مشغّل الوكيل التلقائي — يعمل مجاناً 100% على GitHub-hosted runner
# ويجعل المستودع يتفاعل مع أي Issue يحمل التصنيف agent-task
# أو عبر تشغيل يدوي (workflow_dispatch).
#
# ⚠️ hardening (2026-10-23): مدخل الـ Issue غير موثوق. طُبّقت حدود الطول،
# وتنقيح المخرجات قبل النشر، ومنع الموافقة التلقائية. راجع
# docs/security-threat-model.md (البندان 3 و16) وdocs/ai-code-reliability.md.

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      task_prompt:
        description: 'المهمة المطلوبة من الوكيل'
        required: true
      mode:
        description: 'نمط التنفيذ'
        required: false
        default: 'reason'
        type: choice
        options:
          - reason
          - browser
          - code

# منع التشغيل المتوازي لحماية الحصص المجانية (Rate Limits)
concurrency:
  group: agent-runner-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  execute-agent:
    # يعمل فقط عند: Issue جديد مصنّف agent-task، أو تشغيل يدوي.
    # تقييد إضافي: عند حدث Issues، يشترط أن يكون الكاتب مالكاً أو متعاوناً
    # لتقليل سطح حقن التوجيه من حسابات عشوائية. التشغيل اليدوي لا يتأثر.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.issue.labels.*.name, 'agent-task') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      # حد أقصى لحروف المهمة — يقلّل سطح حقن التوجيه ويحمي الحصة.
      MAX_TASK_CHARS: '8000'
      MAX_COMMENT_CHARS: '12000'

    steps:
      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6 — SHA مثبّت (supply chain)

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6 — SHA مثبّت (supply chain)
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ميزة المتصفح اختيارية: تُثبَّت فقط عند طلب نمط browser صراحةً،
      # لتجنّب جلب aiohttp ذي الثغرات في كل تشغيل (راجع SECURITY.md).
      - name: Install Browser Extra (only for browser mode)
        if: inputs.mode == 'browser'
        run: |
          pip install -r requirements-browser.txt
          playwright install chromium --with-deps

      - name: Restore Strategic Memory
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5 — SHA مثبّت (supply chain)
        with:
          path: .agent_memory
          key: agent-memory-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            agent-memory-${{ github.ref_name }}-
            agent-memory-

      # ---- تحضير المهمة مع حدّ طول صارم ورفض المدخلات الفارغة ----
      - name: Resolve Task
        id: resolve
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          DISPATCH_TASK: ${{ inputs.task_prompt }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "issues" ]; then
            printf '%s\n\n%s' "$ISSUE_TITLE" "$ISSUE_BODY" > agent_task.raw
          else
            printf '%s' "$DISPATCH_TASK" > agent_task.raw
          fi
          size=$(wc -c < agent_task.raw)
          if [ "$size" -gt "$MAX_TASK_CHARS" ]; then
            echo "::error::المهمة أطول من الحد المسموح ($size > $MAX_TASK_CHARS حرفاً)."
            exit 1
          fi
          if [ "$size" -lt 3 ]; then
            echo "::error::المهمة فارغة أو قصيرة جداً."
            exit 1
          fi
          # اقتطاع دفاعي إضافي (حرفاً لا بايتاً) ثم حفظ الملف النهائي
          head -c "$MAX_TASK_CHARS" agent_task.raw > agent_task.txt
          echo "تم تحضير المهمة ($size حرفاً، ضمن الحد $MAX_TASK_CHARS)"

      # ---- التنفيذ: بلا --yes (لا موافقة تلقائية على مدخل غير موثوق) ----
      - name: Execute Autonomous Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -o pipefail
          python -m src.main \
            --mode "${{ inputs.mode || 'reason' }}" \
            --task "$(cat agent_task.txt)" 2>&1 | tee agent_result.txt

      # ---- تنقيح المخرجات قبل نشرها على Issue (قد يكون عاماً) ----
      - name: Comment Result on Issue
        if: github.event_name == 'issues' && always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          {
            echo "### 🤖 نتيجة الوكيل المستقل"
            echo ""
            echo "> ℹ️ هذا المحتوى مولّد بواسطة ذكاء اصطناعي (Gemini/Groq) — راجعه بشرياً."
            echo "> المهمة مُدخلة من مستخدم؛ المخرجات مُنقَّحة آلياً قبل النشر."
            echo ""
            echo '```'
            # تنقيح الأسرار والبيانات الشخصية ثم اقتطاع آمن للنشر
            python scripts/sanitize_output.py agent_result.txt "$MAX_COMMENT_CHARS" \
              2>/dev/null || tail -c "$MAX_COMMENT_CHARS" agent_result.txt 2>/dev/null \
              || echo "لا توجد مخرجات."
            echo '```'
            echo ""
            echo "_آلية التشغيل: GitHub Actions (مجاني) — المزود: Gemini / Groq Free Tier_"
          } > comment_body.md
          gh issue comment "$ISSUE_NUMBER" --body-file comment_body.md

      - name: Upload Result Artifact
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6 — SHA مثبّت (supply chain)
        with:
          name: agent-result
          path: |
            agent_result.txt
            .agent_runs/
          if-no-files-found: ignore
          retention-days: 7
