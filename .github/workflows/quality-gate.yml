name: Quality Gate

# فحص آلي للجودة والاستقرار عند كل دفع أو Pull Request:
# فحص نحوي (compileall) + تدقيق أسلوبي (ruff) + اختبارات (pytest).

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # الحزم الاختيارية تُثبَّت هنا كي لا تُتخطّى اختباراتها في CI:
      # محاكي الكم (qiskit) وقراءة PDF النصية (pypdf). Tesseract يبقى اختيارياً.
      - name: Install Optional Extras (quantum + pdf)
        run: pip install -r requirements-quantum.txt -r requirements-ocr.txt

      - name: Syntax Check (compileall)
        run: python -m compileall -q src tests scripts

      - name: Lint (ruff)
        run: ruff check .

      # تدقيق أمني معلوماتي عبر قاعدة استشارات PyPI العامة — بلا مفاتيح
      # ولا صلاحيات GitHub Security. التقرير لا يُفشل البناء حالياً بسبب
      # التثبيت الحصري الموثّق في SECURITY.md:
      #   browser-use 0.9.7 → aiohttp==3.12.15
      # الهدف: إبقاء التنبيه مرئياً وقابلاً للتتبّع في كل تشغيل بدل أن يظل
      # مخفياً خلف 403 في واجهة Security.
      - name: Dependency Security Audit (informational)
        run: |
          python -m pip install --quiet pip-audit
          pip-audit -r requirements.txt -r requirements-integrations.txt \
                    -r requirements-ocr.txt -r requirements-quantum.txt \
            --format json > audit-report.json || true
          python scripts/security_audit.py audit-report.json

      - name: Tests (pytest)
        run: pytest -q
